<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>🛡️ 坦克戰術指揮部: 教師中控台 (張世杰老師開發設計)</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background: #222;
            color: #eee;
            overflow: hidden;
        }

        header {
            background: #8e44ad;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #9b59b6;
            height: 50px;
        }

        .score-board {
            display: flex;
            gap: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            background: #000;
            padding: 5px 20px;
            border-radius: 5px;
            border: 1px solid #666;
        }

        .score-red {
            color: #ff5252;
        }

        .score-blue {
            color: #448aff;
        }

        .timer {
            color: #ffeb3b;
            font-family: monospace;
            min-width: 80px;
            text-align: center;
        }

        #controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: 0.2s;
        }

        .btn-run {
            background: #4caf50;
            color: white;
        }

        .btn-stop {
            background: #f44336;
            color: white;
        }

        .btn-file {
            background: #2196f3;
            color: white;
        }

        .btn-warn {
            background: #ff9800;
            color: white;
        }

        #main-area {
            display: flex;
            flex: 1;
            overflow: hidden;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        #game-wrapper {
            width: 800px;
            height: 600px;
            position: relative;
            border: 2px solid #555;
        }

        #gameCanvas {
            background: #1a1a1a;
            width: 800px;
            height: 600px;
            cursor: crosshair;
        }

        #map-edit-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #f1c40f;
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            border: 1px solid #f1c40f;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            background: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #34495e;
            width: 450px;
            color: white;
        }

        .panel h2 {
            margin-top: 0;
            color: #f1c40f;
        }

        .panel input,
        .panel select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
        }

        .panel button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 1.1rem;
            background: #27ae60;
            color: white;
        }

        #mapInput {
            display: none;
        }

        footer {
            font-size: 11px;
            color: #cfbfbf;
            text-align: center;
            padding: 5px;
            background: #1b262c;
            border-top: 1px solid #0f4c75;
        }

        /* 覆蓋/增強原有的 header 樣式 */
        header {
            background: #8e44ad;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #6c3483;
            /* 移除固定的 height: 50px; 讓內容自動撐開，或保留亦可 */
        }

        /* 記分板微調 */
        .score-board .divider {
            color: #666;
            margin: 0 10px;
        }

        /* 遊戲控制區 */
        .game-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-text {
            margin-right: 15px;
            font-size: 0.9rem;
            color: #e0e0e0;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
        }

        /* 獨立的地圖工具列設計 */
        .map-toolbar {
            background: #2c3e50;
            /* 深藍灰色背景區分開來 */
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1a252f;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-label {
            color: #bdc3c7;
            font-size: 0.95rem;
            margin-right: 5px;
        }

        /* 共用按鈕設計 */
        button {
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            transition: all 0.2s;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* 工具列按鈕專屬色系 */
        .btn-tool {
            background: #34495e;
            color: #fff;
            border: 1px solid #455a64;
        }

        .btn-tool:focus {
            background: #f39c12;
            border-color: #e67e22;
            color: #fff;
        }

        /* 點擊後保持高亮，提示目前工具 */
        .btn-eraser {
            background: #ffcccc;
            color: #c0392b;
            border: 2px solid #e74c3c;
        }

        .btn-eraser:focus {
            background: #e74c3c;
            color: white;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        /* 工具列按鈕專屬色系 */
        .btn-tool {
            background: #34495e;
            color: #fff;
            border: 1px solid #455a64;
        }

        .btn-tool:hover {
            background: #4a6278;
        }

        /* 🌟 選中狀態：當前拿著的工具會變成橘黃色，明確提示老師 */
        .btn-tool.active {
            background: #f39c12;
            border-color: #e67e22;
            color: #fff;
        }

        .btn-eraser {
            background: #ffcccc;
            color: #c0392b;
            border: 2px solid #e74c3c;
        }

        /* 🌟 橡皮擦的選中狀態：變成實心紅色 */
        .btn-eraser.active {
            background: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="panel">
            <h2>👨‍🏫 教師中控台</h2>
            <label>房間號碼</label>
            <input type="text" id="roomId" value="101">
            <label>⏱️ 比賽時間 (秒)</label>
            <input type="number" id="gameTime" value="180">
            <label>🗺️ 戰場地圖</label>
            <select id="mapSelect" onchange="checkMapMode()">
                <option value="empty">空曠平原</option>
                <option value="obstacles">散兵坑</option>
                <option value="fortress">攻城戰</option>
                <option value="maze">城市迷宮</option>
                <option value="custom">✏️ 自訂/編輯模式</option>
            </select>
            <div id="map-tools"
                style="display:none; margin-top:10px; background:#222; padding:10px; border-radius:5px;">
                <button class="btn-file" onclick="document.getElementById('mapInput').click()"
                    style="width:48%; font-size:0.9rem;">📂 載入地圖</button>
                <button class="btn-warn" onclick="clearMap()" style="width:48%; font-size:0.9rem;">🗑️ 清空重畫</button>
                <input type="file" id="mapInput" accept=".json" onchange="loadMapFromFile(this)">
                <small style="color:#aaa; display:block; margin-top:5px;">*選擇「自訂」進入戰場後，可滑鼠拖曳畫牆</small>
            </div>
            <label>對戰伺服器</label>
            <input type="text" id="serverUrl" value="https://tank-game-server-2iwf.onrender.com">
            <button onclick="connectSystem()">🚀 啟動伺服器</button>
        </div>
    </div>

    <header>
        <div class="score-board">
            <span class="score-red">RED: <span id="scoreRed">0</span></span>
            <span class="divider">|</span>
            <span class="timer" id="timerDisplay">00:00</span>
            <span class="divider">|</span>
            <span class="score-blue">BLUE: <span id="scoreBlue">0</span></span>
        </div>

        <div id="controls" class="game-controls">
            <span id="statusText" class="status-text">未連線</span>
            <button class="btn btn-file" onclick="downloadMapConfig()">💾 下載地圖</button>
            <button class="btn btn-run" onclick="hostStartGame()">🔔 比賽開始</button>
            <button class="btn btn-stop" onclick="hostResetGame()">♻️ 重置</button>
        </div>
    </header>

    <div class="map-toolbar">
        <div class="tool-group">
            <span class="tool-label">📍 地圖畫筆：</span>
            <button class="btn-tool active" onclick="changeTool('random', this)">🎲 隨機</button>
            <button class="btn-tool" onclick="changeTool('🧱', this)">🧱 磚牆</button>
            <button class="btn-tool" onclick="changeTool('🪨', this)">🪨 石頭</button>
            <button class="btn-tool" onclick="changeTool('📦', this)">📦 木箱</button>
            <button class="btn-tool" onclick="changeTool('🛢️', this)">🛢️ 油桶</button>
            <button class="btn-tool" onclick="changeTool('🌲', this)">🌲 樹木</button>
            <button class="btn-tool" onclick="changeTool('🌵', this)">🌵 仙人掌</button>

            <span style="border-left: 1px solid #546e7a; margin: 0 5px; height: 20px;"></span>

            <button class="btn-tool btn-eraser" onclick="changeTool('blank', this)">🧽 橡皮擦</button>
        </div>

        <div class="tool-group">
            <button class="btn-tool btn-danger" onclick="clearMap()">💣 清除全圖</button>
        </div>
    </div>

    <div id="main-area">
        <div id="game-wrapper">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="map-edit-hint">✏️ 編輯模式：按住滑鼠拖曳來畫牆壁</div>
        </div>
    </div>

    <script>
        const CANVAS_W = 800; const CANVAS_H = 600;
        const CANVAS = document.getElementById('gameCanvas');
        const ctx = CANVAS.getContext('2d');
        let roomId = "101";

        let players = {}, bullets = [], walls = [];
        let gameScores = { red: 0, blue: 0 }, gameTimeLeft = 0, gameActive = false;
        let isDrawing = false, startX, startY, isCustomMapMode = false;
        let socket; // 全域變數
        
        // 🌐 全域變數：用來暫存從外部載入的地圖資料
        let externalMaps = {};

        // --- 自訂地圖參數設定 ---
        const GRID_SIZE = 40;       // 貼齊格線大小
        const SPAWN_WIDTH = 100;    // 左右重生區寬度(禁建區)
        let currentDrawMode = 'random'; 

        function changeTool(mode, btnElement) {
            currentDrawMode = mode;
            const tools = document.querySelectorAll('.map-toolbar .btn-tool');
            tools.forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            if (!isCustomMapMode) {
                isCustomMapMode = true;
                document.getElementById('mapSelect').value = 'custom'; 
                setupMapEditor(); 
                renderGame();     
            }
        }

        function snap(val) { return Math.floor(val / GRID_SIZE) * GRID_SIZE; }
        function clampX(x) {
            if (x < SPAWN_WIDTH) return SPAWN_WIDTH;
            if (x > CANVAS_W - SPAWN_WIDTH) return CANVAS_W - SPAWN_WIDTH;
            return x;
        }

        function checkMapMode() {
            const isCustom = document.getElementById('mapSelect').value === 'custom';
            document.getElementById('map-tools').style.display = isCustom ? 'block' : 'none';
            if (!gameActive) {
                if (isCustom) {
                    isCustomMapMode = true;
                    setupMapEditor();
                    renderGame();
                } else {
                    isCustomMapMode = false;
                    loadMapData(document.getElementById('mapSelect').value);
                }
            }
        }

        function connectSystem() {
            roomId = document.getElementById('roomId').value;
            const serverUrl = document.getElementById('serverUrl').value;
            if (!serverUrl) { alert("請輸入伺服器網址！"); return; }

            socket = io(serverUrl);

            socket.on('connect', () => {
                console.log("✅ Socket.io 已連線");
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('statusText').innerText = `🟢 已連線 Server 端物理版 | 房號:${roomId}`;
                socket.emit('joinRoom', roomId);
                checkMapMode();
                broadcastMap();

                let lastLogicTime = 0;
                function renderLoop(ts) {
                    renderGame();
                    requestAnimationFrame(renderLoop);
                }
                requestAnimationFrame(renderLoop);
            });

            socket.on('state', (data) => {
                players = data.players;
                bullets = data.bullets;
                gameScores = data.scores;
                gameTimeLeft = data.time;

                if (typeof data.active !== 'undefined') {
                    gameActive = data.active;
                } else {
                    const maxTime = parseInt(document.getElementById('gameTime').value) || 180;
                    gameActive = !data.gameOver && data.time > 0 && data.time < maxTime;
                }

                document.getElementById('scoreRed').innerText = gameScores.red;
                document.getElementById('scoreBlue').innerText = gameScores.blue;
                let m = Math.floor(gameTimeLeft / 60), s = Math.floor(gameTimeLeft % 60);
                document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0' + s : s}`;

                if (data.gameOver) {
                    let w = data.winner;
                    alert(`⏰ 比賽結束！獲勝隊伍: ${w === 'draw' ? '平手' : (w === 'red' ? '紅隊 🔴' : '藍隊 🔵')}`);
                }
            });

            socket.on('map', (data) => {
                walls = data.walls;
                renderGame();
            });
        }

        function broadcastMap() {
            if (!socket || !socket.connected) return;
            socket.emit('setMap', { roomId, walls });
        }

        let editorSetupDone = false;
        function setupMapEditor() {
            if (editorSetupDone) return;
            editorSetupDone = true;

            CANVAS.addEventListener('mousedown', (e) => {
                if (!isCustomMapMode || gameActive) return;
                const r = CANVAS.getBoundingClientRect();
                let rawX = e.clientX - r.left;
                let rawY = e.clientY - r.top;
                startX = snap(clampX(rawX));
                startY = snap(rawY);
                isDrawing = true;
            });

            CANVAS.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                renderGame();
                const r = CANVAS.getBoundingClientRect();
                let rawX = e.clientX - r.left;
                let rawY = e.clientY - r.top;
                let currentX = snap(clampX(rawX));
                let currentY = snap(rawY);
                let w = currentX - startX;
                let h = currentY - startY;
                ctx.fillStyle = "rgba(0, 255, 0, 0.3)";
                ctx.fillRect(startX, startY, w, h);
                ctx.strokeStyle = "#0f0";
                ctx.lineWidth = 2;
                ctx.strokeRect(startX, startY, w, h);
            });

            CANVAS.addEventListener('mouseup', (e) => {
                if (!isDrawing) return;
                isDrawing = false;
                const r = CANVAS.getBoundingClientRect();
                let rawX = e.clientX - r.left;
                let rawY = e.clientY - r.top;
                let endX = snap(clampX(rawX));
                let endY = snap(rawY);
                let w = endX - startX;
                let h = endY - startY;

                let finalX = w < 0 ? endX : startX;
                let finalY = h < 0 ? endY : startY;
                let finalW = Math.abs(w);
                let finalH = Math.abs(h);

                if (finalW === 0) finalW = GRID_SIZE;
                if (finalH === 0) finalH = GRID_SIZE;

                if (finalW > 0 && finalH > 0) {
                    const emojis = ['🧱', '🪨', '📦', '🛢️', '🌲', '🌵'];
                    let emj = currentDrawMode;
                    if (currentDrawMode === 'random') {
                        emj = emojis[Math.floor(Math.random() * emojis.length)];
                    }

                    for (let gridX = finalX; gridX < finalX + finalW; gridX += GRID_SIZE) {
                        for (let gridY = finalY; gridY < finalY + finalH; gridY += GRID_SIZE) {
                            const existingIndex = walls.findIndex(w => w.x === gridX && w.y === gridY);
                            if (currentDrawMode === 'blank') {
                                if (existingIndex !== -1) walls.splice(existingIndex, 1);
                            } else {
                                if (existingIndex !== -1) {
                                    walls[existingIndex].emoji = emj; 
                                    walls[existingIndex].w = GRID_SIZE;
                                    walls[existingIndex].h = GRID_SIZE;
                                } else {
                                    walls.push({ x: gridX, y: gridY, w: GRID_SIZE, h: GRID_SIZE, emoji: emj });
                                }
                            }
                        }
                    }
                    broadcastMap();
                }
                renderGame();
            });
        }

        function clearMap() {
            if (confirm('確定要清空整個戰場嗎？')) {
                walls = [];
                if (!isCustomMapMode) {
                    isCustomMapMode = true;
                    document.getElementById('mapSelect').value = 'custom';
                    setupMapEditor();
                }
                broadcastMap();
                renderGame(); 
            }
        }

        function downloadMapConfig() {
            const fullProject = { level: { walls: walls }, blocks: null };
            const d = JSON.stringify(fullProject, null, 2);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([d], { type: 'application/json' }));
            a.download = `map_${roomId}.json`;
            a.click();
        }

        function loadMapFromFile(i) {
            const f = i.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = e => {
                try {
                    const d = JSON.parse(e.target.result);
                    let loadedWalls = [];
                    if (d.level && d.level.walls) loadedWalls = d.level.walls;
                    else if (d.walls) loadedWalls = d.walls;
                    else if (Array.isArray(d)) loadedWalls = d;

                    if (loadedWalls.length > 0 || (d.level && d.level.walls)) {
                        document.getElementById('mapSelect').value = 'custom';
                        checkMapMode();
                        walls = loadedWalls;
                        alert("✅ 地圖載入成功");
                        broadcastMap(); 
                        renderGame();
                    } else {
                        alert("❌ 找不到地圖資料");
                    }
                } catch (err) {
                    alert("❌ 格式錯誤");
                }
            };
            r.readAsText(f);
            i.value = '';
        }

        function hostResetGame() {
            if (!isCustomMapMode) loadMapData(document.getElementById('mapSelect').value);
            const timeLimit = parseInt(document.getElementById('gameTime').value);
            if (socket && socket.connected) {
                socket.emit('resetGame', { roomId, timeLimit });
            }
            renderGame();
        }

        function hostStartGame() {
            const timeLimit = parseInt(document.getElementById('gameTime').value);
            if (socket && socket.connected) {
                socket.emit('startGame', { roomId, timeLimit });
            }
        }

        // ✨ 升級版 loadMapData：適應 800x600 與 外部地圖
        function loadMapData(t) {
            walls = [];
            if (t === 'obstacles') {
                walls = [
                    { x: 160, y: 160, w: 40, h: 280, emoji: '🪨' }, 
                    { x: 600, y: 160, w: 40, h: 280, emoji: '🪨' }, 
                    { x: 360, y: 260, w: 80, h: 80, emoji: '🛢️' }
                ];
            } else if (t === 'fortress') {
                walls = [
                    { x: 280, y: 160, w: 240, h: 40, emoji: '🧱' }, 
                    { x: 280, y: 400, w: 240, h: 40, emoji: '🧱' }, 
                    { x: 280, y: 200, w: 40, h: 120, emoji: '🧱' }, 
                    { x: 480, y: 280, w: 40, h: 120, emoji: '🧱' }
                ];
            } else if (t === 'maze') {
                walls = [
                    { x: 160, y: 80, w: 40, h: 440, emoji: '🌲' }, 
                    { x: 320, y: 80, w: 40, h: 320, emoji: '🌲' }, 
                    { x: 440, y: 200, w: 40, h: 320, emoji: '🌲' }, 
                    { x: 600, y: 80, w: 40, h: 440, emoji: '🌲' }
                ];
            } else if (externalMaps[t]) {
                // 🌐 如果老師選了外部地圖，從暫存變數中拿資料
                let loaded = externalMaps[t];
                // 防呆解析，支援多種 JSON 格式寫法
                if (loaded.level && loaded.level.walls) walls = loaded.level.walls;
                else if (loaded.walls) walls = loaded.walls;
                else if (Array.isArray(loaded)) walls = loaded;
            }
            
            broadcastMap();  
            renderGame();
        }

        function renderGame() {
            ctx.fillStyle = "#1a1a1a"; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            if (isCustomMapMode && !gameActive) {
                ctx.fillStyle = "rgba(255, 82, 82, 0.1)";
                ctx.fillRect(0, 0, SPAWN_WIDTH, CANVAS_H);
                ctx.strokeStyle = "rgba(255, 82, 82, 0.5)";
                ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.moveTo(SPAWN_WIDTH, 0); ctx.lineTo(SPAWN_WIDTH, CANVAS_H); ctx.stroke();
                ctx.fillStyle = "rgba(255, 82, 82, 0.4)";
                ctx.font = "14px Arial"; ctx.textAlign = "center";
                ctx.fillText("🔴 紅隊重生禁建區", SPAWN_WIDTH / 2, 20);

                ctx.fillStyle = "rgba(68, 138, 255, 0.1)";
                ctx.fillRect(CANVAS_W - SPAWN_WIDTH, 0, SPAWN_WIDTH, CANVAS_H);
                ctx.strokeStyle = "rgba(68, 138, 255, 0.5)";
                ctx.beginPath(); ctx.moveTo(CANVAS_W - SPAWN_WIDTH, 0); ctx.lineTo(CANVAS_W - SPAWN_WIDTH, CANVAS_H); ctx.stroke();
                ctx.fillStyle = "rgba(68, 138, 255, 0.4)";
                ctx.fillText("🔵 藍隊重生禁建區", CANVAS_W - (SPAWN_WIDTH / 2), 20);
                ctx.setLineDash([]); 
            }

            if (isCustomMapMode) {
                ctx.strokeStyle = "#333"; ctx.lineWidth = 1;
                for (let i = 0; i < CANVAS_W; i += GRID_SIZE) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_H); ctx.stroke(); }
                for (let i = 0; i < CANVAS_H; i += GRID_SIZE) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CANVAS_W, i); ctx.stroke(); }
            }

            walls.forEach(w => {
                let wx = Number(w.x), wy = Number(w.y), ww = Number(w.w), wh = Number(w.h);
                ctx.save();
                ctx.beginPath();
                ctx.rect(wx, wy, ww, wh);
                ctx.clip();
                ctx.font = "26px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                for (let ex = wx + 20; ex < wx + ww; ex += 40) {
                    for (let ey = wy + 20; ey < wy + wh; ey += 40) {
                        ctx.fillText(w.emoji || '🧱', ex, ey);
                    }
                }
                ctx.restore();
            });

            bullets.forEach(b => {
                ctx.fillStyle = b.team === 'red' ? '#ffaaaa' : '#aaaaff';
                ctx.beginPath(); ctx.arc(Number(b.x), Number(b.y), 4, 0, Math.PI * 2); ctx.fill();
            });

            for (let id in players) {
                let p = players[id]; if (p.hp <= 0) continue;
                ctx.save(); ctx.translate(Number(p.x), Number(p.y));
                ctx.fillStyle = "red"; ctx.fillRect(-15, -25, 30, 4);
                ctx.fillStyle = "#0f0"; ctx.fillRect(-15, -25, 30 * (Number(p.hp) / 100), 4);
                ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.textAlign = "center"; ctx.fillText(p.name, 0, -30);
                ctx.rotate(Number(p.angle) * Math.PI / 180);
                ctx.fillStyle = p.team === 'red' ? '#d32f2f' : '#1976d2';
                ctx.fillRect(-12, -12, 24, 24);
                ctx.fillStyle = "#eee"; ctx.fillRect(0, -3, 20, 6);
                ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        // ============================================================
        // 🌐 動態載入 GitHub 外部地圖清單
        // ============================================================
        async function loadExternalMaps() {
            try {
                // 從您的 GitHub 抓取地圖，加入時間戳防止瀏覽器快取舊資料
                const response = await fetch('https://raw.githubusercontent.com/teachthinking/tank_maps/refs/heads/main/maps.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('找不到 maps.json');
                
                // 將資料存入全域變數
                externalMaps = await response.json();
                const mapSelect = document.getElementById('mapSelect');
                
                // 找出 "custom" (自訂/編輯模式) 的選項，以便把新地圖安插在它前面
                const customOption = Array.from(mapSelect.options).find(opt => opt.value === 'custom');

                // 將 JSON 裡的每一個地圖動態加入下拉選單
                for (const mapName in externalMaps) {
                    const option = document.createElement('option');
                    option.value = mapName;
                    option.text = `🌐 自訂: ${mapName}`;
                    
                    if (customOption) {
                        mapSelect.insertBefore(option, customOption);
                    } else {
                        mapSelect.appendChild(option);
                    }
                }
                console.log("✅ 成功載入外部地圖：", Object.keys(externalMaps));
            } catch (error) {
                console.error("⚠️ 無法載入外部地圖，請檢查網址或網路：", error);
            }
        }

        // 啟動網頁時，自動去 GitHub 抓地圖！
        loadExternalMaps();
        
    </script>
